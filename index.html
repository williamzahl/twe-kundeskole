<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-We Kundeskole</title><style>
:root{--n:#071b33;--b:#0879d1;--bg:#f4f7fb;--txt:#142235;--mut:#607086;--line:#dfe6ef}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}.top{background:linear-gradient(135deg,#071b33,#0c3157);color:white;padding:25px 20px;position:sticky;top:0;z-index:5}.topin,.layout,.foot{max-width:1160px;margin:auto}.brand{display:flex;justify-content:space-between;gap:20px}.brand b{font-size:20px}.sub{font-size:13px;opacity:.75;margin-top:3px}.prog{margin-top:18px}.pl{display:flex;justify-content:space-between;font-size:12px;opacity:.8;margin-bottom:6px}.bar{height:5px;background:#ffffff25;border-radius:9px}.fill{height:100%;background:#28a5f5;width:25%;transition:.3s}.layout{display:grid;grid-template-columns:245px 1fr;gap:25px;padding:30px 18px 55px}.side{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;height:max-content;position:sticky;top:145px;box-shadow:0 7px 25px #0a1e3710}.label{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--mut);margin:5px 8px 10px}.lb{display:flex;width:100%;border:0;background:none;text-align:left;padding:12px 9px;border-radius:11px;cursor:pointer;gap:10px;font-size:13px;color:var(--txt);margin-bottom:3px}.lb:hover,.lb.on{background:#eaf5fd}.lb.on{color:#066ebd;font-weight:750}.num{font-size:11px;font-weight:800;color:#8a99aa;min-width:23px}.on .num{color:var(--b)}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:35px;box-shadow:0 10px 35px #0a1e3710}.kick{font-size:12px;color:var(--b);font-weight:850;letter-spacing:1px;text-transform:uppercase}h1{font-size:38px;line-height:1.1;margin:9px 0 13px;letter-spacing:-1px}.lead{font-size:17px;line-height:1.65;color:var(--mut);max-width:800px}.text{font-size:15px;line-height:1.75;color:#34465b}.video{aspect-ratio:16/9;background:#000;border-radius:15px;overflow:hidden;margin:22px 0 28px;box-shadow:0 12px 28px #0002}.video iframe{width:100%;height:100%;border:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.info{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fbfcfe}.info b{display:block;margin-bottom:6px}.info p{margin:0;color:var(--mut);font-size:13px;line-height:1.55}.note{border-left:4px solid var(--b);background:#f1f7fc;padding:15px 17px;border-radius:0 11px 11px 0;font-size:14px;line-height:1.65;margin:21px 0}.st{font-size:22px;margin:30px 0 8px}.vc{border-top:1px solid var(--line);padding-top:22px;margin-top:22px}.vc h3{font-size:18px;margin:0 0 7px}.vc p{font-size:14px;color:var(--mut);line-height:1.65}.actions{display:flex;justify-content:space-between;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}button.nav{border:1px solid var(--line);background:white;padding:12px 17px;border-radius:11px;font-weight:750;cursor:pointer}button.primary{background:var(--n);color:white;border-color:var(--n)}button:disabled{opacity:.35}.cta{margin-top:25px;background:linear-gradient(135deg,var(--n),#0b3d69);color:white;border-radius:17px;padding:24px}.cta h2{margin:0 0 7px}.cta p{margin:0;line-height:1.6;color:#ffffffc9}.foot{text-align:center;color:#7b8999;font-size:12px;padding:0 18px 30px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:relative;top:auto;display:grid;grid-template-columns:1fr 1fr}.label{grid-column:1/-1}.card{padding:25px}}@media(max-width:580px){.side{grid-template-columns:1fr}h1{font-size:31px}.grid{grid-template-columns:1fr}.card{padding:20px}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand"><div><b>T-We KUNDESKOLE</b><div class="sub">T-We & Streaming – enkelt forklart</div></div><span id="count" style="font-size:13px;opacity:.8">Leksjon 1 av 5</span></div><div class="prog"><div class="pl"><span>Din fremgang</span><span id="pct">25%</span></div><div class="bar"><div class="fill" id="fill"></div></div></div></div></header>
<div class="layout"><aside class="side"><div class="label">HELE PAKKEN</div>
<button class="lb on" data-i="0"><span class="num">01</span>Fiber – hele pakken</button>
<div class="label" style="margin-top:14px">T-WE</div>
<button class="lb" data-i="1"><span class="num">02</span>Hva er T-We?</button><button class="lb" data-i="2"><span class="num">03</span>Kutt strømmekostnadene</button><button class="lb" data-i="3"><span class="num">04</span>Se hvor du vil</button><button class="lb" data-i="4"><span class="num">05</span>Funksjoner du får bruk for</button></aside><main class="card" id="content"></main></div><div class="foot">En enkel introduksjon til T-We. Tilgjengelighet og innhold kan endres over tid.</div>
<script>
const V=id=>`<div class="video"><iframe src="https://www.youtube.com/embed/${id}?vq=hd1080" allowfullscreen></iframe></div>`;
const L=[
["Fiber – dette får du med i pakken","Raskt og stabilt internett er grunnlaget for alt i hjemmet. Her får du en enkel oversikt over fiberhastighetene – og de ekstra fordelene som følger med Telenor Fiber.",`
<p class="text">Fiber er en <b>direkte fiberforbindelse helt inn i boligen</b>. Det gir høy kapasitet og en stabil forbindelse som passer godt til streaming, gaming, hjemmekontor og mange enheter samtidig.</p>
<h2 class="st">Velg hastigheten som passer hjemmet</h2>
<div class="grid">
<div class="info"><b>Fiber 150</b><p>Et godt valg for moderat bruk, for eksempel surfing, sosiale medier, HD-streaming og et mindre antall enheter.</p></div>
<div class="info"><b>Fiber 500 ⭐</b><p>Den mest populære hastigheten. Passer godt for familier, flere samtidige brukere, 4K-streaming, gaming og videomøter.</p></div>
<div class="info"><b>Fiber 1000</b><p>Maksimal kapasitet for hjem med mange brukere, mange enheter og høy samtidig bruk.</p></div>
</div>
<div class="note"><b>Enkelt forklart:</b> Jo flere som bruker nettet samtidig, og jo mer krevende ting dere gjør, desto mer kapasitet er det nyttig å ha. Fiber 500 er derfor et veldig godt allround-valg for mange familier.</div>
<h2 class="st">Mer enn bare raskt internett</h2>
<div class="grid">
<div class="info"><b>WiFi Ruter II</b><p>Moderne WiFi-utstyr følger med, slik at hjemmenettet kan fordeles trådløst til mobil, PC, TV, nettbrett og andre enheter.</p></div>
<div class="info"><b>Nettvern+</b><p>Et ekstra sikkerhetsfilter som kan blokkere tilgangen til kjente farlige eller falske nettsider.</p></div>
<div class="info"><b>WiFi-eksperter</b><p>Du har tilgang til hjelp med hjemmenettet dersom du trenger råd eller feilsøking.</p></div>
</div>
<div class="note"><b>Alltid På Nett-garanti:</b> Hvis det oppstår feil på bredbåndsforbindelsen, kan opptil <b>5 personer i husstanden</b> med Telenor mobil få <b>200 GB mobildata hver i opptil 5 dager</b>, mens feilen løses.</div>
<h2 class="st">Og du kan kombinere det med T-We</h2>
<p class="text">Fiber gir selve forbindelsen inn i huset, mens T-We gir TV og underholdning. Sammen får du en komplett løsning for internett, TV og streaming.</p>
<div class="cta"><h2>Først: nettet. Så: underholdningen.</h2><p>Se videre for å få en enkel forklaring på hva T-We er, hvordan det kan samle strømmetjenestene dine og hvilke funksjoner du faktisk får bruk for.</p></div>`],

["Hva er T-We?","T-We samler TV, strømmetjenester og nyttige TV-funksjoner på ett sted – slik at det blir enklere å finne noe å se på.",`
<p class="text">Tenk på T-We som et <b>samlet underholdningssenter</b> på TV-en. Du får TV-kanaler og strømmetjenester fra samme løsning, i stedet for å måtte hoppe mellom mange forskjellige steder.</p>
<div class="grid"><div class="info"><b>TV og streaming</b><p>Samle underholdningen din og finn innhold fra flere tjenester på ett sted.</p></div><div class="info"><b>Enkelt å finne frem</b><p>Startmenyen gir deg oversikt over TV, anbefalinger og innhold.</p></div><div class="info"><b>Mer enn vanlig TV</b><p>T-We Boks III er en moderne strømmeboks med apper og T-We-funksjoner.</p></div></div>
${V("E6j2vVPcyGU")}<h2 class="st">Slik fungerer startmenyen</h2><p class="text">Denne videoen viser hvordan du faktisk finner frem i T-We og hvor du finner innholdet du vil se.</p>${V("NRMtmOvQyTc")}`],

["Kutt strømmekostnadene – og samle alt på ett sted","Har du flere strømmetjenester fra før? T-We gjør det enklere å samle TV og streaming i samme løsning.",`
<p class="text">Mange betaler for flere strømmetjenester og TV-løsninger hver for seg. Med T-We kan du samle mye av underholdningen på ett sted og velge innhold etter hva du faktisk bruker.</p>
<div class="grid"><div class="info"><b>Samle underholdningen</b><p>Finn TV-kanaler og strømmetjenester fra samme T-We-løsning.</p></div><div class="info"><b>Velg selv</b><p>Tilpass innholdet etter hva familien liker å se på.</p></div><div class="info"><b>Bytt etter behov</b><p>Innholdet kan endres når interessene dine endrer seg.</p></div></div>
<div class="note"><b>Tips:</b> T-We har valgbart innhold der en plass kan brukes til en strømmetjeneste eller et utvalg TV-kanaler. Det finnes også mulighet for ekstra plass mot et tillegg.</div>${V("o7Miu1eKCLI")}`],

["Se hvor du vil – for hele familien","T-We følger deg videre enn TV-stua. Med T-We App kan du se TV og underholdning på mobil, nettbrett, PC og kompatible TV-enheter.",`
<p class="text">T-We App er inkludert i TV-abonnementet og gjør det mulig å ta med seg underholdningen. Du kan bruke appen hjemme, på hytta eller på reise i <b>Norge og EU/EØS</b>, så lenge du har internett.</p>
<div class="grid"><div class="info"><b>Mobil og nettbrett</b><p>Se TV når du er på farten – praktisk på hytta, på reise eller hjemme.</p></div><div class="info"><b>PC og Mac</b><p>Se T-We direkte i nettleseren på twe.no.</p></div><div class="info"><b>Flere i familien</b><p>Familiemedlemmer kan få tilgang og bruke egne profiler.</p></div></div>
<div class="note"><b>På reise:</b> T-We App kan brukes i hele EU/EØS. Tilgjengelig innhold kan variere på grunn av rettigheter, og enkelte programmer er kun tilgjengelige hjemme.</div>
<div class="note"><b>Utenfor EU/EØS:</b> Telenor garanterer ikke at T-We er tilgjengelig. VPN er ikke en del av Telenors offisielle løsning, så dette bør ikke presenteres som en garantert måte å få tilgang på.</div>
${V("EePXLpynYbo")}<h2 class="st">T-We på Apple TV</h2><p class="text">Har du Apple TV? Da kan du laste ned T-We-appen og bruke TV-en som visningspunkt for T-We. Videoen viser hvordan du kommer i gang.</p>${V("G_gjHw2JMAU")}`],

["Funksjoner du faktisk får bruk for","T-We Boks III fungerer mye som en smart-TV – men med T-We-funksjonene samlet rundt TV-opplevelsen.",`
<p class="text">T-We Boks III er en Android TV-basert strømmeboks med apper, TV-kanaler og T-We-funksjoner. Den kan kobles til internett via WiFi eller nettverkskabel.</p>
<div class="grid"><div class="info"><b>Ukesarkiv</b><p>Mange programmer kan sees opptil én uke tilbake uten at du tok opp programmet.</p></div><div class="info"><b>Start forfra</b><p>På programmer som støtter funksjonen kan du starte fra begynnelsen.</p></div><div class="info"><b>Apper og streaming</b><p>Bruk blant annet YouTube og andre strømmetjenester direkte på TV-en.</p></div></div>
<div class="note"><b>Opptak:</b> Opptak er en separat tilleggstjeneste. Ukesarkivet er noe annet – mange programmer er tilgjengelige opptil én uke tilbake uten eget opptak.</div>
<div class="vc"><h3>1. Start forfra og se programmer tilbake i tid</h3><p>Se hvordan du kan starte et program fra begynnelsen eller finne programmer som allerede har gått.</p>${V("hzlTY74xUAc")}</div>
<div class="vc"><h3>2. Lei film direkte i T-We</h3><p>Du kan leie filmer direkte fra T-We-menyen. Filmen blir tilgjengelig i 48 timer etter leie.</p>${V("vUD5bxHxPTs")}</div>
<div class="vc"><h3>3. YouTube rett på TV-en</h3><p>T-We Boks III har Android TV og tilgang til apper som YouTube.</p>${V("SYJwCFSEBQQ")}</div>
<div class="vc"><h3>4. Plasser T-We-boksen der du vil</h3><p>Boksen kan kobles til internett via WiFi. Du trenger derfor ikke TV-uttak akkurat der TV-en står.</p>${V("kRL9QuQnxh0")}</div>
<div class="cta"><h2>Da har du fått oversikten 👌</h2><p>Fiber sørger for forbindelsen, og T-We samler TV og streaming. Sammen får du en komplett løsning for hjemmet.</p></div>`]
];
let cur=0;
function render(){let x=L[cur];document.getElementById("content").innerHTML=`<div class="kick">Leksjon ${String(cur+1).padStart(2,"0")}</div><h1>${x[0]}</h1><p class="lead">${x[1]}</p>${x[2]}<div class="actions"><button class="nav" id="prev" ${cur?"":"disabled"}>← Forrige</button><button class="nav primary" id="next">${cur<4?"Neste leksjon →":"Til toppen ↑"}</button></div>`;document.querySelectorAll(".lb").forEach((b,i)=>b.classList.toggle("on",i===cur));let p=(cur+1)/5*100;document.getElementById("fill").style.width=p+"%";document.getElementById("pct").textContent=Math.round(p)+"%";document.getElementById("count").textContent=`Leksjon ${cur+1} av 5`;document.getElementById("prev").onclick=()=>{if(cur){cur--;render();scrollTo({top:0,behavior:"smooth"})}};document.getElementById("next").onclick=()=>{if(cur<4){cur++;render();scrollTo({top:0,behavior:"smooth"})}else scrollTo({top:0,behavior:"smooth"})}}
document.querySelectorAll(".lb").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render();scrollTo({top:0,behavior:"smooth"})});render();
</script></body></html>
